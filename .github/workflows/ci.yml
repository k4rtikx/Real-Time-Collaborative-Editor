name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DJANGO_SETTINGS_MODULE: doc_editor.settings.testing
  SECRET_KEY: ci-test-secret-key-not-for-production
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collabedit_test
  REDIS_URL: redis://localhost:6379

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collabedit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations
        run: python manage.py migrate --no-input

      - name: Run tests
        run: |
          python -m pytest apps/ tests/ \
            --tb=short \
            --cov=apps \
            --cov=core \
            --cov-report=term-missing \
            --cov-fail-under=70

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: pip install flake8 black isort

      - name: Check formatting (black)
        run: black --check apps/ core/ doc_editor/

      - name: Check import order (isort)
        run: isort --check-only apps/ core/ doc_editor/

      - name: Lint (flake8)
        run: flake8 apps/ core/ doc_editor/ --max-line-length=100 --extend-ignore=E203,W503
