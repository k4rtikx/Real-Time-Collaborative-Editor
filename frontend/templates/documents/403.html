{% extends "base.html" %}
{% block title %}Access Denied — CollabEdit{% endblock %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 56px);padding:2rem;">
  <div style="text-align:center;max-width:420px;">
    <div style="font-size:4rem;margin-bottom:1rem;">🔒</div>
    <h1 style="font-size:1.6rem;margin-bottom:.75rem;">Access denied</h1>
    <p style="color:var(--text-muted);margin-bottom:2rem;">
      You don't have permission to view or edit this document. If you believe this is a mistake, ask the document owner to share it with you.
    </p>
    <a href="{% url 'documents:list' %}" class="btn btn-primary">Go to my documents</a>
  </div>
</div>
{% endblock %}
