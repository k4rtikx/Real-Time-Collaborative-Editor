<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CollabEdit{% endblock %}</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Design tokens                                                        */
    /* ------------------------------------------------------------------ */
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-alt: #22263a;
      --border: #2e3250;
      --accent: #7c6af7;
      --accent-hover: #9b8dff;
      --danger: #e05c5c;
      --text: #e8eaf6;
      --text-muted: #8e93b0;
      --radius: 6px;
      --shadow: 0 4px 24px rgba(0,0,0,.45);
    }

    /* ------------------------------------------------------------------ */
    /* Reset & base                                                         */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    /* ------------------------------------------------------------------ */
    /* Nav                                                                  */
    /* ------------------------------------------------------------------ */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-shrink: 0;
    }
    nav .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: -.5px;
    }
    nav .brand span { color: var(--text); }
    nav .spacer { flex: 1; }
    nav .nav-link {
      color: var(--text-muted);
      font-size: .9rem;
      transition: color .15s;
    }
    nav .nav-link:hover { color: var(--text); }

    /* ------------------------------------------------------------------ */
    /* Buttons                                                              */
    /* ------------------------------------------------------------------ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .45rem 1rem;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-size: .875rem;
      font-weight: 500;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: var(--surface-alt); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { opacity: .88; }
    .btn-sm { padding: .3rem .7rem; font-size: .8rem; }

    /* ------------------------------------------------------------------ */
    /* Alerts / messages                                                    */
    /* ------------------------------------------------------------------ */
    .messages { padding: .5rem 1.5rem; }
    .alert {
      padding: .6rem 1rem;
      border-radius: var(--radius);
      margin-bottom: .5rem;
      font-size: .875rem;
    }
    .alert-error   { background: rgba(224,92,92,.15); border: 1px solid var(--danger); color: #f5a0a0; }
    .alert-success { background: rgba(92,224,138,.12); border: 1px solid #3cca6e; color: #8ff5b2; }
    .alert-info    { background: rgba(124,106,247,.12); border: 1px solid var(--accent); color: var(--accent-hover); }
    .alert-warning { background: rgba(224,180,92,.12); border: 1px solid #c99a2e; color: #f5d08a; }

    /* ------------------------------------------------------------------ */
    /* Main content area                                                    */
    /* ------------------------------------------------------------------ */
    main { flex: 1; }

    /* ------------------------------------------------------------------ */
    /* Form helpers                                                         */
    /* ------------------------------------------------------------------ */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: .35rem; font-size: .875rem; color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: .55rem .75rem;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .9rem;
      transition: border-color .15s;
    }
    .form-control:focus { outline: none; border-color: var(--accent); }
    .form-errors { font-size: .8rem; color: #f5a0a0; margin-top: .3rem; }

    /* ------------------------------------------------------------------ */
    /* Utilities                                                            */
    /* ------------------------------------------------------------------ */
    .text-muted { color: var(--text-muted); }
    .text-center { text-align: center; }
    .mt-1 { margin-top: .5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <a href="/" class="brand">Collab<span>Edit</span></a>
  <div class="spacer"></div>
  {% if user.is_authenticated %}
    <a href="{% url 'documents:list' %}" class="nav-link">My Documents</a>
    <a href="{% url 'accounts:logout' %}" class="nav-link btn btn-secondary btn-sm">Log out</a>
  {% else %}
    <a href="{% url 'accounts:login' %}" class="nav-link">Log in</a>
    <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">Sign up</a>
  {% endif %}
</nav>

{% if messages %}
<div class="messages">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
