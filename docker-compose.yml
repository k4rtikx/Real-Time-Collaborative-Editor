services:

  web:
    build: .
    container_name: collabedit_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=doc_editor.settings.development
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate --no-input &&
             uvicorn doc_editor.asgi:application --host 0.0.0.0 --port 8000 --reload"

  redis:
    image: redis:7-alpine
    container_name: collabedit_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
